# Warden — Configuration
# Missing settings fall back to the defaults shown here, except group_id in
# [mqtt], which must be set; misspelled settings and values of the wrong type
# fall back too: that includes a fraction where a whole number is expected, and
# a negative count. Other values outside the limits given below stop warden
# from starting.

# How often to read the sensor, in seconds: 2 to 3600
# (the DHT22 needs 2 s between readings)
read_interval_s = 5

# How many readings to average before evaluating thresholds: 1 to 1000
averaging_window = 10

# How many failed or implausible readings in a row count as a sensor fault,
# shown as a steady red LED: 1 to 100
fault_after_failed_reads = 5

[thresholds]
# A value strictly greater than its threshold is exceeded:
# one exceeded value means Warning, both mean Alert.
# Humidity is relative humidity in %, so 0 to 100. Each threshold must lie
# within its [plausible_values] below. At the range's maximum, it is never exceeded.
temperature = 28.0
humidity    = 70.0

[plausible_values]
# Readings outside these ranges are skipped as implausible for this site.
# The DHT22 itself measures -40..80 C and 0..100 %, so these should be the same
# or narrower.
min_temperature =   0.0
max_temperature =  50.0
min_humidity    =   0.0
max_humidity    = 100.0

[mqtt]
# Your group's id: the last part of your repository's name, group-1 for
# cpp-2027p-projektas-group-1. Every topic starts with it.
group_id = "group-1"

# Identifies this device in every message. Default: <group_id>-pi5 on the Pi
# and <group_id>-sim in the simulation, so a message shows which one sent it.
# Run only one at a time: both publish on the group's topics.
#device_id = "group-1-pi5"

# The broker to connect to. Keep ONE of the three sections below and comment out
# the other two; two at once set the same setting twice, which is an error. Paths
# are relative to this file's folder.

# ── Your own broker, plain: broker/dev ──
# By default this computer, as seen from the dev container. From the Pi, use this
# computer's LAN address.
host = "host.docker.internal"
port = 1883

# ── Your own broker, with TLS and a password: broker/dev-tls ──
#host = "<this computer's LAN address>"
#port = 8883
#tls = true
#ca_file = "../../broker/dev-tls/certs/ca.crt"
## No ready-made certificate can name your LAN address, so only the host name
## check is off; the certificate itself is still checked.
#tls_check_hostname = false

# ── The course broker, at the university: broker/course ──
#host = "<address given in class>"
#port = 8883
#tls = true
#ca_file = "../../broker/course/certs/ca.crt"

# Your group's login, from Moodle, for the two brokers above that need one. The
# password goes alone in the file named here, which is in .gitignore.
#username = "<your group's user>"
#password_file = "mqtt-password"
