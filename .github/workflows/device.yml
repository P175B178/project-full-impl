name: Device

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['device/**', 'protocol/**', '.github/workflows/device.yml']
  pull_request:
    branches: [main]
    paths: ['device/**', 'protocol/**', '.github/workflows/device.yml']
  # Also lets a run be started by hand: Actions tab, Device, Run workflow.
  workflow_dispatch:

# The device program is the CMake project in device/: every step runs there.
defaults:
  run:
    working-directory: device

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            clang clang-format clang-tidy pkgconf libmosquitto-dev

      - name: Check formatting
        run: |
          cmake --preset debug
          cmake --build --preset debug --target format-check

      - name: Static analysis (clang-tidy)
        run: cmake --workflow --preset tidy

      - name: Build and test (Debug)
        run: |
          cmake --build --preset debug
          ctest --preset debug

      - name: Build and test (Release)
        run: cmake --workflow --preset release

  # Compiles and lints the Pi drivers on the host, without a Pi or the cross toolchain.
  hardware:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            clang clang-tidy pkgconf libgpiod-dev libmosquitto-dev

      - name: Build hardware drivers with clang-tidy
        run: cmake --workflow --preset tidy-hardware

  # Cross-compiles the Pi release build and packages it, as the Workflow: Package
  # task does. The .deb can be downloaded from the run's summary page.
  package:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies, including the arm64 cross toolchain
        run: |
          dpkg --add-architecture arm64
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            pkgconf gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libgpiod-dev:arm64 libmosquitto-dev:arm64

      - name: Build the Pi package
        run: cmake --workflow --preset package

      - name: Keep the .deb
        uses: actions/upload-artifact@v4
        with:
          name: warden-deb
          path: device/package/*.deb
          retention-days: 14
