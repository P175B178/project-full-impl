name: Desktop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'protocol/**', '.github/workflows/desktop.yml']
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'protocol/**', '.github/workflows/desktop.yml']
  # Also lets a run be started by hand: Actions tab, Desktop, Run workflow.
  workflow_dispatch:

# The desktop program is the CMake project in desktop/: every step runs there.
defaults:
  run:
    working-directory: desktop

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    env:
      DEBIAN_FRONTEND: noninteractive
      # QtMqtt is not packaged by Debian. It is built below into its own folder,
      # where find_package(Qt6 COMPONENTS Mqtt) looks too.
      QT_ADDITIONAL_PACKAGES_PREFIX_PATH: /opt/qtmqtt
      QT_VERSION: 6.8.2

    steps:
      - uses: actions/checkout@v4

      # Debian's Qt is the same version as the dev container's (6.8.2), so the
      # code is checked against the same Qt, Qt Charts included. The private
      # headers are needed to build QtMqtt.
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            clang clang-format clang-tidy \
            qt6-base-dev qt6-base-private-dev qt6-charts-dev

      # Building QtMqtt takes a few minutes, so the result is kept between runs.
      - name: Cache QtMqtt
        id: qtmqtt
        uses: actions/cache@v4
        with:
          path: /opt/qtmqtt
          key: qtmqtt-${{ env.QT_VERSION }}-debian13

      - name: Build QtMqtt
        if: steps.qtmqtt.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v$QT_VERSION" https://github.com/qt/qtmqtt.git /tmp/qtmqtt
          cmake -S /tmp/qtmqtt -B /tmp/qtmqtt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/qtmqtt
          cmake --build /tmp/qtmqtt-build
          cmake --install /tmp/qtmqtt-build

      - name: Check formatting
        run: |
          cmake --preset debug
          cmake --build --preset debug --target format-check

      - name: Static analysis (clang-tidy)
        run: cmake --workflow --preset tidy

      - name: Build and test (Debug)
        run: |
          cmake --build --preset debug
          ctest --preset debug

      - name: Build and test (Release)
        run: cmake --workflow --preset release
