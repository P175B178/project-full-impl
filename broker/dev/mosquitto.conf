# Mosquitto configuration: plain MQTT on port 1883, and anyone may connect
# without a username and password. Fine on your own machine, not on a network
# you share. See https://mosquitto.org/man/mosquitto-conf-5.html for all options.

listener 1883
allow_anonymous true

# Keep retained messages, such as each device's last status, across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
