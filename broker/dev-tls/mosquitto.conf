# Mosquitto configuration: TLS on port 8883, and only the user in passwd may
# connect. The certificates and passwd come from Moodle (README.md); start.sh
# copies them to the paths read here. See https://mosquitto.org/man/mosquitto-conf-5.html.

listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

allow_anonymous false
password_file /mosquitto/passwd

# Keep retained messages, such as each device's last status, across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
